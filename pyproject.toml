[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-consumidor"
version = "0.1.0"
description = "Pipeline em camadas (bronze, prata, ouro) com dbt e DuckDB sobre reclamações do consumidor.gov.br, com testes de qualidade de dados"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Arthur Penedo" }]
dependencies = ["dbt-duckdb>=1.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[project.scripts]
pipeline-consumidor = "pipeline_consumidor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
